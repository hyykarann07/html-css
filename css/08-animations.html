<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS Transitions and Animations</title>
  <!-- Connects the CSS file to this page -->
  <link rel="stylesheet" href="08-animations.css" />
</head>
<body>
  <h1>Transitions and Animations</h1>

  <h3>Transition (hover me)</h3>
  <button class="btn">Hover me</button>
  <div class="grow-box">Hover: I grow</div>

  <h3>Animation</h3>
  <div class="bounce"></div>
  <div class="spinner"></div>
  <p class="fade">I fade in when the page loads.</p>
</body>
</html>
