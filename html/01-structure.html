<!DOCTYPE html>
<!-- ↑ Tells the browser: "this is a modern HTML5 page". Always the first line. -->
<html lang="en">
<!-- <html> wraps the whole page. lang="en" = the page language. -->

<head>
  <!-- <head> holds information ABOUT the page (not shown on the page). -->
  <meta charset="UTF-8" />
  <!-- charset lets you use all characters, like emojis 😀 and Hindi हिंदी -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- makes the page look right on phones -->
  <title>My First Page</title>
  <!-- the title shown on the browser tab -->
</head>

<body>
  <!-- <body> holds everything you SEE on the page. -->
  <h1>Hello, World!</h1>
  <p>This is my first web page.</p>

  <!--
    An HTML ELEMENT looks like this:

    <p class="intro">Hello</p>
     │    │            │    │
     │    └ attribute  │    └ closing tag
     └ opening tag     └ content

    Some tags have no closing tag (self-closing): <br>, <img>, <hr>, <input>
  -->
</body>

</html>
