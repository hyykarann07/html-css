<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS Selectors and Colors</title>
  <!-- Connects the CSS file to this page -->
  <link rel="stylesheet" href="01-selectors.css" />
</head>
<body>
  <h1>Selectors and Colors</h1>
  <p>I am a normal paragraph.</p>
  <p class="highlight">I have the class "highlight".</p>
  <p id="special">I have the id "special".</p>

  <div class="card">
    <p>A paragraph inside a card.</p>
    <span>A span inside a card.</span>
  </div>

  <ul>
    <li>Hover over me</li>
    <li>Hover over me too</li>
  </ul>

  <a href="#" class="btn">A button-like link</a>
</body>
</html>
