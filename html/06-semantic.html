<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semantic HTML</title>
</head>
<body>

  <!--
    SEMANTIC tags describe the MEANING of each part of the page.
    They help search engines, screen readers and other developers.
    Prefer these over many plain <div>s.
  -->

  <header>
    <h1>My Blog</h1>
    <nav>
      <a href="#">Home</a> |
      <a href="#">About</a> |
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Latest posts</h2>

      <article>
        <h3>Learning HTML</h3>
        <p>HTML is easy to start with...</p>
      </article>

      <article>
        <h3>Learning CSS</h3>
        <p>CSS makes pages beautiful...</p>
      </article>
    </section>

    <aside>
      <h2>About me</h2>
      <p>I love web development.</p>
    </aside>
  </main>

  <footer>
    <p>&copy; 2026 My Blog</p>
  </footer>

  <!--
    header  -> top of the page/section (logo, title)
    nav     -> navigation links
    main    -> the main content (only one per page)
    section -> a group of related content
    article -> content that makes sense alone (a post, a news story)
    aside   -> side content (ads, extra info)
    footer  -> bottom of the page/section
  -->

</body>
</html>
