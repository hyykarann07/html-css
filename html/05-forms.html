<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HTML Forms</title>
  <style>
    label { display: block; margin-top: 12px; }
    form { max-width: 360px; }
  </style>
</head>
<body>

  <h1>Sign-up form</h1>

  <!-- A form collects information from the user. -->
  <form action="#" method="post">

    <!-- label + input. "for" must match the input's "id" (click the label to focus the box) -->
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your name" required />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" minlength="6" required />

    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="1" max="100" />

    <label for="dob">Date of birth</label>
    <input type="date" id="dob" name="dob" />

    <!-- RADIO buttons: same name = choose only one -->
    <p>Gender:</p>
    <label><input type="radio" name="gender" value="male" /> Male</label>
    <label><input type="radio" name="gender" value="female" /> Female</label>
    <label><input type="radio" name="gender" value="other" /> Other</label>

    <!-- CHECKBOXES: choose many -->
    <p>Hobbies:</p>
    <label><input type="checkbox" name="hobby" value="coding" /> Coding</label>
    <label><input type="checkbox" name="hobby" value="music" /> Music</label>

    <!-- DROPDOWN -->
    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="">-- Select --</option>
      <option value="in">India</option>
      <option value="us">USA</option>
      <option value="uk">UK</option>
    </select>

    <!-- BIG TEXT BOX -->
    <label for="msg">Message</label>
    <textarea id="msg" name="msg" rows="4" cols="30"></textarea>

    <br /><br />
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </form>

  <!--
    Useful attributes:
    required     -> must be filled
    placeholder  -> hint text
    disabled     -> can't be used
    min / max    -> limits for numbers and dates
  -->

</body>
</html>
