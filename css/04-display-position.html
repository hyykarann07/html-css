<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS Display and Position</title>
  <!-- Connects the CSS file to this page -->
  <link rel="stylesheet" href="04-display-position.css" />
</head>
<body>
  <h1>Display and Position</h1>

  <h2>Display</h2>
  <div class="demo">Block (div) takes the full width</div>
  <span class="demo">Inline 1</span>
  <span class="demo">Inline 2</span>
  <span class="demo inline-block">Inline-block</span>
  <span class="demo inline-block">Inline-block</span>
  <p class="hidden">You can not see me (display: none)</p>

  <h2>Position</h2>
  <div class="parent">
    Parent (position: relative)
    <div class="child">Child (absolute)</div>
  </div>

  <div class="fixed-badge">Fixed</div>

  <p class="filler">Scroll down…<br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br />The blue badge stays in the corner!</p>
</body>
</html>
