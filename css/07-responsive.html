<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS Responsive Design</title>
  <!-- Connects the CSS file to this page -->
  <link rel="stylesheet" href="07-responsive.css" />
</head>
<body>
  <header class="top">
    <h1>Responsive Design</h1>
    <p>Resize your browser window to see the layout change.</p>
  </header>

  <div class="layout">
    <nav class="box nav">Menu</nav>
    <main class="box main">Main content</main>
    <aside class="box side">Sidebar</aside>
  </div>

  <img class="responsive-img" src="https://placehold.co/800x300" alt="Responsive placeholder" />
</body>
</html>
