<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Links and Images</title>
</head>
<body>

  <h1>Links</h1>

  <!-- LINK to another website -->
  <p><a href="https://www.google.com">Go to Google</a></p>

  <!-- Open in a NEW TAB (rel keeps it safe) -->
  <p><a href="https://www.wikipedia.org" target="_blank" rel="noopener noreferrer">Wikipedia (new tab)</a></p>

  <!-- LINK to another page in your own project -->
  <p><a href="02-text.html">Go to the text lesson</a></p>

  <!-- EMAIL and PHONE links -->
  <p><a href="mailto:hello@example.com">Send an email</a></p>
  <p><a href="tel:+911234567890">Call me</a></p>

  <!-- LINK to a section on the SAME page -->
  <p><a href="#bottom">Jump to the bottom</a></p>

  <h1>Images</h1>

  <!-- IMAGE: src = where the picture is, alt = text if it can't load (also used by screen readers) -->
  <img src="https://placehold.co/300x150" alt="A grey placeholder image" width="300" />
  <!-- Replace src with your own file, like: src="photo.jpg" -->

  <!-- IMAGE with CAPTION -->
  <figure>
    <img src="https://placehold.co/200x100" alt="Another placeholder" />
    <figcaption>This is a caption.</figcaption>
  </figure>

  <!-- IMAGE as a LINK -->
  <a href="https://www.google.com">
    <img src="https://placehold.co/120x60?text=Click" alt="Click me" />
  </a>

  <h2 id="bottom">You reached the bottom 🎉</h2>

</body>
</html>
